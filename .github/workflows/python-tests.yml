name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository hygiene
        run: python -B tools/check_repository_hygiene.py
      - name: Run Python tests
        run: python -B -m unittest discover -s tools/tests -t tools
